name: UI Tests and Snapshots

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ui-test:
    name: Run UI Automation
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake with vcpkg
      run: |
        cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static

    - name: Build MfcNews executable
      run: |
        cmake --build build --config Release

    - name: Run UI Automation Script
      shell: powershell
      run: |
        .\scripts\automate_ui.ps1

    - name: Commit and push screenshots if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add screenshots/*.png
        git diff-index --quiet HEAD || (git commit -m "chore: update UI screenshots from CI" && git push)
      shell: bash

    - name: Upload UI Screenshots and Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-snapshots
        path: |
          screenshots/*.png
          mfcnews_debug.log
          build/**/*.map
